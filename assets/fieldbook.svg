<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 600" role="img" aria-label="Fieldbook handbook: a search box over a list of component documentation entries.">
  <defs>
    <style>
      .bg{fill:#F8F6F0}
      .ink{fill:#1c1b18}
      .mut{fill:#8a857a}
      .line{stroke:#d9d3c6;stroke-width:1}
      .lbl{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px;fill:#1c1b18}
      .sub{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10.5px;fill:#8a857a}
      .h{font-family:'Fraunces',Georgia,serif;font-size:22px;fill:#1c1b18}
      .tny{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:9.5px;fill:#8a857a}
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="840" height="600"/>

  <!-- header -->
  <text class="h" x="40" y="58">Fieldbook</text>
  <text class="tny" x="132" y="58">HANDBOOK</text>
  <line class="line" x1="40" y1="78" x2="800" y2="78"/>

  <!-- search box -->
  <rect x="40" y="100" width="760" height="52" rx="3" fill="#F3F0E8" stroke="#c9c4b8"/>
  <circle cx="70" cy="126" r="8" fill="none" stroke="#8a857a" stroke-width="2"/>
  <line x1="76" y1="132" x2="84" y2="140" stroke="#8a857a" stroke-width="2"/>
  <text class="lbl" x="98" y="131" fill="#8a857a">Search components, tokens, patterns…</text>
  <rect x="720" y="114" width="64" height="24" rx="2" fill="#efece4" stroke="#d9d3c6"/>
  <text class="tny" x="734" y="130">⌘ K</text>

  <text class="sub" x="40" y="188">6 RESULTS</text>

  <!-- result rows -->
  <g>
    <line class="line" x1="40" y1="202" x2="800" y2="202"/>
    <text class="lbl" x="40" y="228">Button</text>
    <text class="sub" x="40" y="246">Primary, secondary, ghost. One label per intent.</text>
    <text class="tny" x="740" y="230">core</text>

    <line class="line" x1="40" y1="266" x2="800" y2="266"/>
    <text class="lbl" x="40" y="292">Input</text>
    <text class="sub" x="40" y="310">Label above, helper below, error below that.</text>
    <text class="tny" x="734" y="294">forms</text>

    <line class="line" x1="40" y1="330" x2="800" y2="330"/>
    <text class="lbl" x="40" y="356">Card</text>
    <text class="sub" x="40" y="374">Use only when elevation means hierarchy.</text>
    <text class="tny" x="740" y="358">core</text>

    <line class="line" x1="40" y1="394" x2="800" y2="394"/>
    <text class="lbl" x="40" y="420">Tokens</text>
    <text class="sub" x="40" y="438">Colour, spacing, type. Generated from Loom.</text>
    <text class="tny" x="726" y="422">system</text>

    <line class="line" x1="40" y1="458" x2="800" y2="458"/>
    <text class="lbl" x="40" y="484">Dialog</text>
    <text class="sub" x="40" y="502">Focus trap, escape to close, restore focus.</text>
    <text class="tny" x="716" y="486">overlay</text>
    <line class="line" x1="40" y1="522" x2="800" y2="522"/>
  </g>

  <text class="tny" x="40" y="548">indexed by pagefind · 128 pages · avg answer in 1 keystroke</text>
  <text class="tny" x="700" y="548">build: passing</text>
  <circle cx="690" cy="544" r="4" fill="#315C55"/>
</svg>
